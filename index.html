<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monsoon Memories</title>

    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inconsolata', sans-serif;
            height: 100vh;
            background: linear-gradient(45deg, #7CB9E8, #002D62);
            animation: gradient-animation 10s infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradient-animation {
            0% {
                background: linear-gradient(45deg, #7CB9E8, #002D62);
            }

            50% {
                background: linear-gradient(45deg, #002D62, cornflowerblue);
            }

            100% {
                background: linear-gradient(45deg, #7CB9E8, #002D62);
            }
        }

        .bokeh {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 60%);
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-20px) scale(1.1);
            }
        }

        .section {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 10px;
            color: white;
            width: 400px;
            height: auto;
            min-height: 200px;
            transform: translate(-50%, -50%);
            cursor: move;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 2;
        }

        .section h2 {
            margin: 0;
            font-size: 18px;
            color: #002D62;
            padding: 8px 12px;
            text-align: center;
            cursor: grab;
        }

        .section-content {
            flex-grow: 1;
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.1);
        }

        .section-content iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
        }

        .resizer {
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: nwse-resize;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .mute-toggle {
            padding: 5px 10px;
            font-size: 14px;
            color: #004d99;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .mute-toggle:hover {
        color: white;
        }
    </style>
</head>

<body>
    <!-- Bokeh container -->
    <div id="bokeh-container"></div>

    <!-- Section for each category -->
    <div class="section" style="top: 20%; left: 15%;">
        <h2>Rain at Three</h2>
        <div class="section-content">
            <iframe src="rain at three/index.html" title="Rain at Three" allow="autoplay"></iframe>
        </div>
        <div class="mute-toggle">Mute</div>
        <div class="resizer"></div>
    </div>

    <div class="section" style="top: 50%; left: 30%;">
        <h2>Monsoon Musings</h2>
        <div class="section-content">
            <iframe src="Monsoon Musings/index.html" title="Monsoon Musings" allow="autoplay"></iframe>
        </div>
        <div class="mute-toggle">Mute</div>
        <div class="resizer"></div>
    </div>

    <div class="section" style="top: 70%; left: 15%;">
        <h2>Moment</h2>
        <div class="section-content">
            <iframe src="moment/index.html" title="Moment" allow="autoplay"></iframe>
        </div>
        <div class="mute-toggle" >Mute</div>
        <div class="resizer"></div>
    </div>

    <div class="section" style="top: 35%; left: 55%;">
        <h2>When the Sky is a Soaked Teabag</h2>
        <div class="section-content">
            <iframe src="when the sky is soaked teabag/index.html" title="When the Sky is a Soaked Teabag"
                allow="autoplay"></iframe>
        </div>
        <div class="mute-toggle">Mute</div>
        <div class="resizer"></div>
    </div>

    <div class="section" style="top: 65%; left: 85%;">
        <h2>Whispering Wisps</h2>
        <div class="section-content">
            <iframe src="whispering whisps/index.html" title="Whispering Wisps" allow="autoplay"></iframe>
        </div>
        <div class="mute-toggle">Mute</div>
        <div class="resizer"></div>
    </div>

    <div class="section" style="top: 20%; left: 85%;">
        <h2>Stay Back Till the Sun Comes</h2>
        <div class="section-content">
            <iframe src="stay back till the sun comes/index.html" title="Stay Back Till the Sun Comes"
                allow="autoplay"></iframe>
        </div>
        <div class="mute-toggle">Mute</div>
        <div class="resizer"></div>
    </div>

    <div class="section" style="top: 80%; left: 45%;">
        <h2>Chai</h2>
        <div class="section-content">
            <iframe src="chai/index.html?autoplay=1" title="Chai" allow="autoplay"></iframe>
        </div>
        <div class="mute-toggle">Mute</div>
        <div class="resizer"></div>
    </div>

    <script>
        const sections = document.querySelectorAll('.section');

// Dragging functionality
sections.forEach(section => {
    const header = section.querySelector('h2');
    let isDragging = false, offsetX, offsetY;

    header.addEventListener('mousedown', (e) => {
        isDragging = true;
        offsetX = e.clientX - section.offsetLeft;
        offsetY = e.clientY - section.offsetTop;
        header.style.cursor = 'grabbing';
        document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        section.style.left = `${e.clientX - offsetX}px`;
        section.style.top = `${e.clientY - offsetY}px`;
    });

    document.addEventListener('mouseup', () => {
        isDragging = false;
        header.style.cursor = 'grab';
        document.body.style.userSelect = '';
    });

    // Resizing functionality
    const resizer = section.querySelector('.resizer');
    let isResizing = false, startWidth, startHeight, startX, startY;

    resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        startWidth = section.offsetWidth;
        startHeight = section.offsetHeight;
        startX = e.clientX;
        startY = e.clientY;
        document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const width = startWidth + (e.clientX - startX);
        const height = startHeight + (e.clientY - startY);
        section.style.width = `${width}px`;
        section.style.height = `${height}px`;
    });

    document.addEventListener('mouseup', () => {
        isResizing = false;
        document.body.style.userSelect = '';
    });

    // Mute/Unmute functionality
    const iframe = section.querySelector('iframe');
    const muteButton = section.querySelector('.mute-toggle');
    let isMuted = false;

    muteButton.addEventListener('click', () => {
        if (!iframe.contentWindow) {
            console.error('Iframe content not accessible');
            return;
        }

        // Toggle mute state
        isMuted = !isMuted;
        muteButton.textContent = isMuted ? 'Unmute' : 'Mute';

        // Send mute/unmute command to iframe
        iframe.contentWindow.postMessage({ command: isMuted ? 'mute' : 'unmute' }, '*');
    });
});

// Create bokeh effect
const bokehContainer = document.getElementById('bokeh-container');
function createBokeh() {
    const bokeh = document.createElement('div');
    bokeh.className = 'bokeh';

    const size = Math.random() * 80 + 20; // Random size between 20 and 100
    bokeh.style.width = `${size}px`;
    bokeh.style.height = `${size}px`;

    bokeh.style.left = `${Math.random() * window.innerWidth}px`;
    bokeh.style.top = `${Math.random() * window.innerHeight}px`;

    bokehContainer.appendChild(bokeh);

    setTimeout(() => bokeh.remove(), 10000); // Remove after animation ends
}

setInterval(createBokeh, 500); // Create a bokeh every 500ms
    </script>
</body>

</html>
